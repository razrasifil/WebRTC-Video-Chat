<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 WebRTC Bahar Sohbeti 🌿</title>
    <style>
        /* --- Temel Ayarlar & Bahar Renkleri --- */
        :root {
            --pembe-ana: #ffafcc; /* Ana pembe tonu */
            --pembe-koyu: #ff8fab; /* Buton hover tonu */
            --yesil-ana: #a7c957; /* Yeşil tonu */
            --yesil-koyu: #6a994e; /* Başlık ve detay tonu */
            --beyaz-transparan: rgba(255, 255, 255, 0.85);
            --golge: 0 8px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* Arka plan: Hafif pembe ve yeşil degrade */
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%), 
                        linear-gradient(to top, #a8edea 0%, #fed6e3 100%);
            background-blend-mode: soft-light;
            color: #333;
        }

        /* --- Ana Konteyner --- */
        #app-container {
            background: var(--beyaz-transparan);
            width: 90%;
            max-width: 1000px;
            margin-top: 50px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--golge);
            backdrop-filter: blur(10px); /* Arka planı hafif bulandırma efekti */
            border: 2px solid #fff;
            text-align: center;
        }

        /* --- Başlık Stili --- */
        h2 {
            color: var(--yesil-koyu);
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        h2 span.emoji {
            font-size: 1.2em;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* --- Video Alanları --- */
        #videos-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-box {
            flex: 1;
            min-width: 300px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 4px solid #fff;
            background-color: #f0f0f0;
            transition: transform 0.3s ease;
        }
        
        .video-box:hover {
            transform: scale(1.02); /* Hafif büyüme efekti */
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover; /* Görüntüyü kutuya sığdırır */
        }

        /* Video etiketleri (Sen / Karşı Taraf) */
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            backdrop-filter: blur(2px);
        }

        /* --- Kontrol Butonları --- */
        #controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Kamerayı Başlat Butonu (Yeşil) */
        #startButton {
            background-color: var(--yesil-ana);
            color: #fff;
        }

        #startButton:hover {
            background-color: var(--yesil-koyu);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        /* Arama Yap Butonu (Pembe) */
        #callButton {
            background-color: var(--pembe-ana);
            color: #fff;
        }

        #callButton:hover:not(:disabled) {
            background-color: var(--pembe-koyu);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        /* Buton devre dışıysa */
        button:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none !important;
        }
        
        /* Footer veya ekstra detay */
        footer {
            margin-top: auto;
            margin-bottom: 20px;
            color: #888;
            font-size: 0.9em;
        }

    </style>
</head>
<body>
    <div id="app-container">
        <h2>
            <span class="emoji">🌸</span> 
            WebRTC Bahar Sohbeti
            <span class="emoji">🌿</span>
        </h2>
        <p class="subtitle">Kameranı başlat ve baharın tazeliğinde sohbete başla!</p>
        
        <div id="videos-container">
            <div class="video-box" id="localVideoBox">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">Sen (Yerel)</div>
            </div>
            <div class="video-box" id="remoteVideoBox">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Karşı Taraf (Uzak)</div>
            </div>
        </div>

        <div id="controls">
            <button id="startButton">Kamerayı Başlat 📷</button>
            <button id="callButton" disabled>Arama Yap 📞</button>
        </div>
    </div>
    
    <footer>Powered by WebRTC & C# Signaling</footer>

    <script src="main.js"></script>
</body>
</html>
